name: ip-actor-platform

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    image: ip-actor-web:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_BASE_URL: /api
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.28-alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    ports:
      - "${WEB_BIND_IP:-0.0.0.0}:${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging: *default-logging

  backend:
    image: ip-actor-backend:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.11-slim-bookworm}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    env_file:
      - path: ${CONNECTOR_ENV_FILE:-./deployment.connectors.env.example}
        required: true
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ip_actor_platform}
      MYSQL_USER: ${MYSQL_USER:-ip_actor}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      INITIAL_ROOT_PASSWORD: ${INITIAL_ROOT_PASSWORD:?INITIAL_ROOT_PASSWORD is required}
      TOKEN_TTL_SECONDS: ${TOKEN_TTL_SECONDS:-43200}
      REDIS_CACHE_TTL_SECONDS: ${REDIS_CACHE_TTL_SECONDS:-3600}
      OSS_PROVIDER: ${OSS_PROVIDER:-local-placeholder}
      ALIYUN_OSS_ENDPOINT: ${ALIYUN_OSS_ENDPOINT:-}
      ALIYUN_OSS_BUCKET: ${ALIYUN_OSS_BUCKET:-}
      ALIYUN_OSS_ACCESS_KEY_ID: ${ALIYUN_OSS_ACCESS_KEY_ID:-}
      ALIYUN_OSS_ACCESS_KEY_SECRET: ${ALIYUN_OSS_ACCESS_KEY_SECRET:-}
      ALIYUN_OSS_PUBLIC_BASE_URL: ${ALIYUN_OSS_PUBLIC_BASE_URL:-}
      ALIYUN_OSS_CONFIG_PATH: ${ALIYUN_OSS_CONFIG_PATH:-/root/.ossutilconfig}
      IMAGE_GENERATION_AUTHORIZATION: ${IMAGE_GENERATION_AUTHORIZATION:-}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-}
      MINIO_BUCKET: ${MINIO_BUCKET:-ip-actor-platform}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      LLAMA_SERVER_URL: ${LLAMA_SERVER_URL:-}
      LLAMA_SERVER_MODEL: ${LLAMA_SERVER_MODEL:-local-model}
      LLAMA_SERVER_TIMEOUT_SECONDS: ${LLAMA_SERVER_TIMEOUT_SECONDS:-300}
      LLAMA_SERVER_MAX_TOKENS: ${LLAMA_SERVER_MAX_TOKENS:-800}
      LLM_PROVIDER: ${LLM_PROVIDER:-siliconflow}
      SILICONFLOW_BASE_URL: ${SILICONFLOW_BASE_URL:-https://api.siliconflow.cn/v1}
      SILICONFLOW_MODEL: ${SILICONFLOW_MODEL:-Qwen/Qwen3.5-35B-A3B}
      SILICONFLOW_MAX_TOKENS: ${SILICONFLOW_MAX_TOKENS:-8192}
      SILICONFLOW_THINKING_BUDGET: ${SILICONFLOW_THINKING_BUDGET:-2048}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      WECHAT_MINIAPP_APPID: ${WECHAT_MINIAPP_APPID:-}
      WECHAT_MINIAPP_SECRET: ${WECHAT_MINIAPP_SECRET:-}
      ANALYSIS_ALLOWED_ORIGINS: ${ANALYSIS_ALLOWED_ORIGINS:-}
      TZ: Asia/Shanghai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${REPORTS_DATA_SOURCE:-reports_data}:/app/storage
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ping', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ip_actor_platform}
      MYSQL_USER: ${MYSQL_USER:-ip_actor}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ${MYSQL_DATA_SOURCE:-mysql_data}:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql --host=127.0.0.1 --user=\"$${MYSQL_USER}\" --database=\"$${MYSQL_DATABASE}\" --silent --execute='SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - ${REDIS_DATA_SOURCE:-redis_data}:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

volumes:
  mysql_data:
  redis_data:
  reports_data:
